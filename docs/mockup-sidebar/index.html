<header class="intro"><div><div class="eyebrow">ZAINO · Studio dell’interfaccia</div><h1>Meno accenti, più orientamento.</h1><p>Tre proposte per distinguere le sezioni, il materiale selezionato e il riquadro in uso.</p></div><div class="view-switch" aria-label="Vista del prototipo"><button data-view="confronto">Confronta</button><button data-view="app">Esplora nell’app</button></div></header>
<main class="page" id="main"></main>
<nav class="dock" aria-label="Varianti del mockup"><small>MOCKUP</small><button class="arrow" id="prev" aria-label="Variante precedente"><svg class="ico" style="transform:rotate(180deg)"><use href="#arrow"/></svg></button><button data-variant-button="A">A · Segni</button><button data-variant-button="B">B · Etichette</button><button data-variant-button="C">C · Schede</button><button class="arrow" id="next" aria-label="Variante successiva"><svg class="ico"><use href="#arrow"/></svg></button><span class="divider"></span><span class="state" id="state" role="status" aria-live="polite"></span></nav>
<script>
const varianti={
 A:{nome:'Segni sottili',breve:'La struttura rimane familiare. Il verde indica soltanto dove stai lavorando.',sidebar:'Titoli neutri e spaziatura. Una linea verde e il peso del testo segnalano il materiale selezionato.',attivo:'Linea verde sopra la testata, numero pieno e nome dello strumento in evidenza.',inattivo:'Testata grigia e testo leggibile. Il contenuto rimane a pieno contrasto.',confronto:'<b>Il cambiamento più contenuto.</b> Conserva la struttura attuale e riduce le grandi superfici verdi.'},
 B:{nome:'Etichette esplicite',breve:'Il colore è accompagnato da parole e da un segno di selezione.',sidebar:'Categorie in minuscolo, con più respiro. Il materiale selezionato ha una spunta e un fondo leggero.',attivo:'L’etichetta «In uso» chiarisce quale riquadro riceverà i comandi.',inattivo:'«Aperto» distingue il riquadro disponibile da un controllo disabilitato.',confronto:'<b>La più esplicita per chi inizia.</b> «In uso», «Aperto» e la spunta rendono lo stato riconoscibile anche senza colore.'},
 C:{nome:'Schede e cornici',breve:'Categorie raccolte in schede e un bordo che identifica il riquadro attivo.',sidebar:'Categorie delimitate con icone. La voce selezionata si distingue per contrasto e spunta.',attivo:'Cornice intorno al riquadro e linguetta sottolineata. Il colore occupa pochissimo spazio.',inattivo:'Il riquadro mantiene la propria cornice neutra, separata dal piano di lavoro.',confronto:'<b>La più strutturata.</b> I confini separano chiaramente gli spazi, ma aggiungono più linee alla UI.'}
};
const parametri=new URLSearchParams(location.search);
let variante=varianti[parametri.get('variant')]?parametri.get('variant'):'A';
let vista=parametri.get('view')==='app'?'app':'confronto';
let attivo=2,selezionato='presenta',pagina=1;
const aperti={appunti:false,mappe:false,fonti:true,schede:false,media:true,presenta:true};
let documento='fonte';
const gruppi=[
 {id:'appunti',nome:'Appunti',icona:'note',voci:[['appunto','Cosa ho capito','note']]},
 {id:'mappe',nome:'Mappe',icona:'map',voci:[['mappa','Pianeti e orbite','map']]},
 {id:'fonti',nome:'Fonti',icona:'file',voci:[['fonte','Sistema solare.pdf','file']]},
 {id:'schede',nome:'Schede',icona:'cards',voci:[['scheda','Sistema solare','cards']]},
 {id:'media',nome:'Media',icona:'image',voci:[['saturno','Saturno','image'],['terra','La Terra','image'],['sole','Il Sole','image']]},
 {id:'presenta',nome:'Presenta',icona:'slides',voci:[['presenta','Sistema solare','slides']]}
];
function icona(nome,classe=''){return '<svg class="ico '+classe+'" aria-hidden="true"><use href="#'+nome+'"/></svg>'}
function sidebar(v){return '<aside class="sidebar" aria-label="Materiali nello zaino">'+gruppi.map(g=>'<section class="group" data-open="'+aperti[g.id]+'"><div class="group-head"><button class="group-toggle" data-group="'+g.id+'" aria-expanded="'+aperti[g.id]+'">'+icona('chevron','chev')+icona(g.icona,'group-icon')+'<span>'+g.nome+'</span><span class="group-count">'+g.voci.length+'</span></button></div><div class="group-items" '+(!aperti[g.id]?'hidden':'')+'>'+(g.id==='media'?'<div class="nav-subtitle">Immagini</div>':'')+g.voci.map(([id,titolo,ico])=>'<button class="nav-item" data-item="'+id+'" aria-current="'+(id===selezionato)+'">'+(v==='C'?icona(ico):'')+'<span class="item-text">'+titolo+'</span>'+((id===documento||id==='presenta')&&id!==selezionato?'<span class="open-mark" title="Aperto nel riquadro '+(id==='presenta'?2:1)+'">'+(id==='presenta'?2:1)+'</span>':'')+icona('check','check')+'</button>').join('')+'</div></section>').join('')+'</aside>'}
function testata(n,v){const corrente=n===attivo;const tipo=n===1?tipoDocumento():'Presenta';return '<header class="pane-head"><button class="pane-activate" data-pane="'+n+'" aria-pressed="'+corrente+'" aria-label="Attiva riquadro '+n+', '+tipo+'"><span class="pane-num">'+n+'</span><span class="pane-kind">'+tipo.toUpperCase()+'</span>'+icona('chevron','chev')+'<span class="pane-name">Sistema solare</span><span class="pane-status">'+(corrente?(v==='C'?'In uso':'In uso'):'Aperto')+'</span></button><span class="pane-corner" aria-hidden="true">'+icona('expand')+icona('close')+'</span></header>'}
function tipoDocumento(){return documento==='appunto'?'Appunti':documento==='mappa'?'Mappe':documento==='scheda'?'Schede':['saturno','terra','sole'].includes(documento)?'Immagine':'Documento'}
function logo(){return '<svg class="bag" viewBox="0 0 28 38" aria-hidden="true"><path d="M10 8V6a4 4 0 0 1 8 0v2" fill="none" stroke="#303c35" stroke-width="1.6"/><path d="M4 35V16a10 10 0 0 1 20 0v19z" fill="#ed735e" stroke="#303c35" stroke-width="1.6"/><path d="M7 32V16a7 7 0 0 1 14 0v16zM8 25h12" fill="none" stroke="#303c35" stroke-width="1.3"/></svg>'}
function saturno(){return '<svg class="saturn-art" viewBox="0 0 360 200" aria-label="Illustrazione di Saturno"><ellipse cx="180" cy="106" rx="147" ry="32" fill="none" stroke="#52655a" stroke-width="3" transform="rotate(-14 180 106)"/><circle cx="180" cy="100" r="65" fill="#d99a51"/><path d="M124 68c28 21 74 21 111 0M116 95c45 20 84 20 128-1M122 122c29 17 81 17 116-2" fill="none" stroke="#bb7d3b" stroke-width="7" opacity=".65"/><path d="M37 141c43 21 242-29 287-69" fill="none" stroke="#52655a" stroke-width="5"/></svg>'}
function orbite(){return '<svg class="diagram" viewBox="0 0 440 168" aria-label="Schema delle orbite dei pianeti"><ellipse cx="200" cy="85" rx="150" ry="63" fill="none" stroke="#ccd4c8"/><ellipse cx="200" cy="85" rx="108" ry="44" fill="none" stroke="#ccd4c8"/><ellipse cx="200" cy="85" rx="61" ry="26" fill="none" stroke="#ccd4c8"/><circle cx="200" cy="85" r="21" fill="#e3ad45"/><circle cx="141" cy="81" r="5" fill="#9d9f91"/><circle cx="294" cy="63" r="9" fill="#70949a"/><circle cx="71" cy="117" r="7" fill="#bc7756"/><text x="229" y="91" font-family="Arial" font-size="11" fill="#56665b">Sole</text><text x="307" y="61" font-family="Arial" font-size="11" fill="#56665b">Terra</text><text x="42" y="142" font-family="Arial" font-size="11" fill="#56665b">Marte</text></svg>'}
function corpoDocumento(){if(documento==='appunto')return '<div class="note-body"><div class="doc-kicker">Appunto personale</div><h2>Cosa ho capito</h2><p>Il Sole è una stella. Gli otto pianeti gli girano attorno seguendo le loro orbite.</p><h3>Una domanda per domani</h3><p>Perché Saturno ha gli anelli?</p></div>';
 if(['saturno','terra','sole'].includes(documento)){const nome=documento==='saturno'?'Saturno':documento==='terra'?'La Terra':'Il Sole';return '<div class="document"><div class="doc-kicker">Immagini dello zaino</div><h2>'+nome+'</h2><div class="media-panel">'+(documento==='saturno'?saturno():'<svg viewBox="0 0 240 180" aria-label="Illustrazione di '+nome+'"><circle cx="120" cy="90" r="64" fill="'+(documento==='terra'?'#799f9d':'#e3ad45')+'"/>'+(documento==='terra'?'<path d="m91 38 37 8 10 29-22 25-24-10-14-22zM150 99l28 9-15 29-20 9-8-22z" fill="#496e56"/>':'<circle cx="101" cy="74" r="10" fill="#c98e39"/><circle cx="139" cy="108" r="7" fill="#c98e39"/>')+'</svg>')+'</div><p class="small-caption">Materiale selezionato nella sidebar.</p></div>'}
 if(documento==='mappa')return '<div class="document"><div class="doc-kicker">Mappa</div><h2>Pianeti e orbite</h2>'+orbite()+'<p><b>Sole</b> → al centro del sistema</p><p><b>Pianeti</b> → percorrono un’orbita</p><p><b>Satelliti</b> → orbitano attorno ai pianeti</p></div>';
 if(documento==='scheda')return '<div class="document"><div class="doc-kicker">Scheda di ripasso · 1 di 9</div><h2>Che cosa distingue una stella da un pianeta?</h2><div class="doc-rule"></div><p>Una stella produce luce ed energia. Un pianeta riflette la luce della sua stella.</p></div>';
 return '<article class="document"><div class="doc-kicker">Scienze · Il nostro universo</div><h2>Il sistema<br>solare</h2><p class="lead">Una stella, otto pianeti e tanti altri corpi celesti.</p>'+orbite()+'<h3>Un viaggio attorno al Sole</h3><p>Il Sole si trova al centro del nostro sistema. <mark>La sua gravità mantiene i pianeti in orbita.</mark> Ogni pianeta impiega un tempo diverso per completare il suo percorso.</p><div class="doc-rule"></div><h3>I pianeti giganti</h3><p>Giove, Saturno, Urano e Nettuno sono i pianeti più lontani dal Sole.</p><div class="folio"><span>Sistema solare.pdf</span><span>3 / 12</span></div></article>'}
function corpoPresenta(){return '<div class="slide-editor"><div class="thumbs"><button class="thumb" data-slide="1" aria-label="Slide 1, Saturno" aria-pressed="'+(pagina===1)+'"><div class="thumb-picture"><span class="planet"></span></div><small>1 · Saturno</small></button><button class="thumb" data-slide="2" aria-label="Slide 2, Le orbite" aria-pressed="'+(pagina===2)+'"><div class="thumb-picture secondary">◎</div><small>2 · Orbite</small></button></div><div class="slide-content"><section class="slide"><h2>'+(pagina===1?'Saturno e i suoi anelli':'Tutti attorno al Sole')+'</h2>'+(pagina===1?saturno():orbite())+'<p>'+(pagina===1?'Gli anelli sono composti da ghiaccio e frammenti di roccia.':'I pianeti percorrono orbite diverse attorno alla nostra stella.')+'</p></section><div class="slide-tabs" aria-hidden="true"><span class="current">TITOLO</span><span>IMMAGINE</span><span>TESTO</span><span>SFONDO</span></div><div class="slide-options" aria-hidden="true"><span class="sample-field">Atkinson Hyperlegible '+icona('chevron')+'</span><span class="sample-style">G</span><span class="sample-style"><i>C</i></span><span class="sample-style"><u>S</u></span></div><div class="saved">'+icona('check')+'Salvato</div></div></div>'}
function app(v){return '<div class="app" data-variant="'+v+'"><div class="topbar"><div class="brand">'+logo()+'<span class="brand-label">STUDIA</span></div><div class="zaino-name">ZAINO SISTEMA SOLARE '+icona('chevron')+'</div><div class="top-tools" aria-hidden="true">'+icona('search')+icona('split')+'<span class="new-cards"><strong>9</strong> CARTE NUOVE</span>'+icona('chat')+icona('settings')+icona('moon')+'</div></div><div class="workspace">'+sidebar(v)+'<div class="panes"><section class="pane '+(attivo===1?'is-active':'')+'" data-pane-container="1">'+testata(1,v)+'<div class="toolstrip"><span class="tool">'+icona('file')+tipoDocumento().toUpperCase()+'</span><span class="push">100%</span><span>···</span></div><div class="pane-body" tabindex="0" aria-label="Contenuto del riquadro 1, attiva con Invio" data-activate="1">'+corpoDocumento()+'</div></section><section class="pane '+(attivo===2?'is-active':'')+'" data-pane-container="2">'+testata(2,v)+'<div class="toolstrip"><span>DOCUMENTO</span><span class="tool">'+icona('plus')+'INSERISCI</span><span class="push tool">'+icona('play')+'PRESENTA</span></div><div class="pane-body presentation-body" tabindex="0" aria-label="Contenuto del riquadro 2, attiva con Invio" data-activate="2">'+corpoPresenta()+'</div></section></div></div></div>'}
function titoloVariante(v,compatto=false){return '<div class="specification"><span class="variant-letter">'+v+'</span><div><h2>'+varianti[v].nome+'</h2><p>'+varianti[v].breve+'</p></div>'+(v==='A'&&!compatto?'<span class="recommend">Punto di partenza</span>':'')+'</div>'}
function confronto(){return '<p class="compare-hint">'+icona('cursor')+'Clicca una testata per cambiare il riquadro in uso. «Esplora» mostra la proposta nel contesto completo.</p><div class="comparison">'+Object.keys(varianti).map(v=>'<article class="compare-card" data-card="'+v+'">'+titoloVariante(v,true)+'<div data-variant="'+v+'"><div class="compare-sidebar">'+sidebar(v)+'</div><div class="compare-pane-area">'+[1,2].map(n=>'<div><p class="specimen-label">'+(attivo===n?'Riquadro attivo':'Riquadro inattivo')+'</p><section class="pane '+(attivo===n?'is-active':'')+'">'+testata(n,v)+'<div class="sample-content">'+(n===1?'Sistema solare.pdf · pagina 3':'Sistema solare · slide 1')+'</div></section></div>').join('')+'</div></div><p class="compare-note">'+varianti[v].confronto+'</p><button class="explore-button" data-explore="'+v+'">Esplora '+v+' nell’app '+icona('arrow')+'</button></article>').join('')+'</div>'}
function aggiornaUrl(){const p=new URLSearchParams({variant:variante,view:vista});history.replaceState(null,'','?'+p)}
function render(){document.getElementById('main').innerHTML=vista==='confronto'?confronto():titoloVariante(variante)+app(variante)+'<div class="explanation"><div><strong>Sidebar</strong><p>'+varianti[variante].sidebar+'</p></div><div><strong>Testata attiva</strong><p>'+varianti[variante].attivo+'</p></div><div><strong>Testata inattiva</strong><p>'+varianti[variante].inattivo+'</p></div></div>';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===vista));document.querySelectorAll('[data-variant-button]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variantButton===variante&&vista==='app'));document.getElementById('state').textContent='Riquadro '+attivo+' in uso · '+(attivo===2?'Presenta':tipoDocumento());aggiornaUrl()}
function cambiaVariante(v){variante=v;vista='app';render()}
function attiva(n){attivo=Number(n);selezionato=attivo===2?'presenta':documento;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.view){vista=b.dataset.view;render();return}if(b.dataset.variantButton){cambiaVariante(b.dataset.variantButton);return}if(b.dataset.explore){cambiaVariante(b.dataset.explore);window.scrollTo({top:0});return}if(b.dataset.group){const id=b.dataset.group;aperti[id]=!aperti[id];render();return}if(b.dataset.item){selezionato=b.dataset.item;if(selezionato==='presenta'){attivo=2}else{documento=selezionato;attivo=1}render();return}if(b.dataset.pane){attiva(b.dataset.pane);return}if(b.dataset.slide){pagina=Number(b.dataset.slide);attiva(2);return}if(b.id==='prev'||b.id==='next'){const chiavi=Object.keys(varianti);cambiaVariante(chiavi[(chiavi.indexOf(variante)+(b.id==='next'?1:2))%3]);return}}
 const contenuto=e.target.closest('[data-activate]');if(contenuto&&Number(contenuto.dataset.activate)!==attivo)attiva(contenuto.dataset.activate)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable=true]'))return;if((e.key==='Enter'||e.key===' ')&&e.target.dataset.activate){e.preventDefault();attiva(e.target.dataset.activate);return}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const chiavi=Object.keys(varianti);cambiaVariante(chiavi[(chiavi.indexOf(variante)+(e.key==='ArrowRight'?1:2))%3])}});
render();
</script>
</body></html>
